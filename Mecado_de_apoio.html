<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercado de Apoio</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#eef2f5;
}

/* NAVBAR */
.navbar{
    background: linear-gradient(135deg, #0b5ed7, #1e90ff);
    padding:15px 30px;
    color:white;
    position:relative;
    overflow:hidden;
}

.navbar::after{
    content:"";
    position:absolute;
    bottom:-20px;
    left:0;
    width:100%;
    height:60px;
    background: repeating-linear-gradient(
        -45deg,
        rgba(255,255,255,.25),
        rgba(255,255,255,.25) 10px,
        transparent 10px,
        transparent 20px
    );
    opacity:.4;
}

.navbar-content{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.nav-links{
    display:flex;
    gap:18px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    padding:8px 14px;
    border-radius:20px;
    transition:.2s;
}

.nav-links a:hover{
    background:rgba(255,255,255,.25);
}

/* LAYOUT */
.main{
    display:flex;
    max-width:1200px;
    margin:auto;
    padding:20px;
    gap:20px;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background:white;
    border-radius:14px;
    padding:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
    height:fit-content;
}

.sidebar h3{
    margin-bottom:15px;
}

.filter{
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
    cursor:pointer;
    background:#f1f5f9;
    transition:.2s;
}

.filter:hover, .filter.active{
    background:#1e90ff;
    color:white;
}

/* GRID */
.grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
}

/* CARDS */
.card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
    transition:.2s;
}

.card:hover{
    transform:translateY(-6px);
}

.card img{
    width:100%;
    height:160px;
    object-fit:cover;
}

.card-content{
    padding:14px;
}

.price{
    color:#16a34a;
    font-weight:bold;
}

.city{
    color:#555;
    font-size:14px;
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="navbar-content">
        <strong>🌊 Rede da Pesca</strong>
        <div class="nav-links">
            <a href="Index.html">Meu Perfil</a>
            <a href="Mercado_de_demandas.html">Mercado de Demandas</a>
            <a href="#">Comunidade</a>
        </div>
    </div>
</nav>

<div class="main">

    <div class="sidebar">
        <h3>⚙️ Mercado de Apoio</h3>
        <div class="filter active" data-type="all">Todos</div>
        <div class="filter" data-type="equipamentos">Equipamentos de Pesca</div>
        <div class="filter" data-type="barcos">Barcos</div>
        <div class="filter" data-type="motores">Motores</div>
	<div class="filter" data-type="processamento">Equipamentos de Processamento</div>
        <div class="filter" data-type="credito">Mercado de Crédito</div>
    </div>

    <div class="grid" id="supportGrid"></div>

</div>

<script>
const supports = [
{
    type:"equipamentos",
    name:"Rede Profissional Nylon",
    price:1200,
    city:"Paranaguá",
    image:"https://picsum.photos/400/300?gear1"
},
{
    type:"barcos",
    name:"Barco de Alumínio 6m",
    price:28000,
    city:"Antonina",
    image:"https://picsum.photos/400/300?boat1"
},
{
    type:"motores",
    name:"Motor 15HP Yamaha",
    price:9500,
    city:"Curitiba",
    image:"https://picsum.photos/400/300?motor1"
},
{
    type:"credito",
    name:"Crédito Rural Pesca",
    price:0,
    city:"Banco Regional",
    image:"https://picsum.photos/400/300?finance1"
},
{
    type:"equipamentos",
    name:"Caixa Térmica 200L",
    price:1800,
    city:"Morretes",
    image:"https://picsum.photos/400/300?gear2"
}
];

const grid = document.getElementById("supportGrid");
const filters = document.querySelectorAll(".filter");

function render(list){
    grid.innerHTML = "";
    list.forEach(s=>{
        grid.innerHTML += `
        <div class="card">
            <img src="${s.image}">
            <div class="card-content">
                <h3>${s.name}</h3>
                <p class="price">
                    ${
                      s.price === 0 
                      ? "Consultar condições" 
                      : s.price.toLocaleString("pt-BR", { style:"currency", currency:"BRL" })
                    }
                </p>
                <p class="city">📍 ${s.city}</p>
            </div>
        </div>
        `;
    });
}

filters.forEach(f=>{
    f.addEventListener("click", ()=>{
        filters.forEach(x=>x.classList.remove("active"));
        f.classList.add("active");

        const type = f.dataset.type;
        if(type === "all") render(supports);
        else render(supports.filter(s=>s.type === type));
    });
});

supports.push(
{
    type:"processamento",
    name:"Mesa Inox para Filetagem",
    price:3200,
    city:"Paranaguá",
    image:"https://picsum.photos/400/300?table1"
},
{
    type:"processamento",
    name:"Freezer Horizontal 500L",
    price:7800,
    city:"Curitiba",
    image:"https://picsum.photos/400/300?freezer1"
},
{
    type:"processamento",
    name:"Serra de Peixe Industrial",
    price:12500,
    city:"Joinville",
    image:"https://picsum.photos/400/300?machine1"
}
);



render(supports);
</script>

</body>
</html>
